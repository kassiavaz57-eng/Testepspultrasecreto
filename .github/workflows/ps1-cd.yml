name: Butterscotch PS1 CD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: luksamuk/psxtoolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Butterscotch source
        run: git clone --depth 1 https://github.com/ButterscotchRunner/Butterscotch.git upstream

      - name: Fetch official Butterscotch preprocessor
        run: git clone --depth 1 https://github.com/ButterscotchRunner/ButterscotchPreprocessor.git preprocessor

      - name: Build official preprocessor
        run: |
          cd preprocessor
          chmod +x ./gradlew
          ./gradlew :processor-cli:installDist --no-daemon

      - name: Generate real Chapter 1 runtime assets
        run: |
          rm -rf ps1/assets
          mkdir -p ps1/assets
          ./preprocessor/processor-cli/build/install/processor-cli/bin/butterscotch-preprocessor \
            data.win \
            --output ps1/assets \
            --target ps2
          test -s ps1/assets/ATLAS.BIN
          test -s ps1/assets/TEXTURES.BIN
          test -s ps1/assets/CLUT4.BIN
          test -s ps1/assets/CLUT8.BIN

      - name: Build real Butterscotch core with PS1 backend
        run: |
          export PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b
          export PATH=/opt/psn00bsdk/bin:$PATH
          cmake -S ps1 -B ps1/build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$PSN00BSDK_LIBS/cmake/sdk.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ps1/build -j2

      - name: Prepare Chapter 1 CD
        run: |
          mkdir -p ps1/cd out
          cp ps1/build/butterscotch_ps1.exe ps1/cd/BUTTER.EXE
          cp data.win ps1/cd/DATA.WIN
          cp ps1/assets/ATLAS.BIN ps1/cd/ATLAS.BIN
          cp ps1/assets/TEXTURES.BIN ps1/cd/TEXTURES.BIN
          cp ps1/assets/CLUT4.BIN ps1/cd/CLUT4.BIN
          cp ps1/assets/CLUT8.BIN ps1/cd/CLUT8.BIN
          if [ -s ps1/assets/SOUNDBNK.BIN ]; then cp ps1/assets/SOUNDBNK.BIN ps1/cd/SOUNDBNK.BIN; fi
          if [ -s ps1/assets/SOUNDS.BIN ]; then cp ps1/assets/SOUNDS.BIN ps1/cd/SOUNDS.BIN; fi
          printf 'BOOT=cdrom:\\BUTTER.EXE;1\nTCB=4\nEVENT=10\nSTACK=801FFFF0\n' > ps1/cd/SYSTEM.CNF
          cat > ps1/cd.xml <<'XML'
          <?xml version="1.0"?>
          <iso_project image_name="butterscotch_ps1" cue_sheet="butterscotch_ps1.cue">
            <track type="data">
              <identifiers system="PLAYSTATION" application="PLAYSTATION" volume="BUTTERSCOTCH" publisher="BUTTERSCOTCH"/>
              <directory_tree>
                <file name="SYSTEM.CNF" type="data" source="cd/SYSTEM.CNF"/>
                <file name="BUTTER.EXE" type="data" source="cd/BUTTER.EXE"/>
                <file name="DATA.WIN" type="data" source="cd/DATA.WIN"/>
                <file name="ATLAS.BIN" type="data" source="cd/ATLAS.BIN"/>
                <file name="TEXTURES.BIN" type="data" source="cd/TEXTURES.BIN"/>
                <file name="CLUT4.BIN" type="data" source="cd/CLUT4.BIN"/>
                <file name="CLUT8.BIN" type="data" source="cd/CLUT8.BIN"/>
              </directory_tree>
            </track>
          </iso_project>
          XML
          mkpsxiso ps1/cd.xml
          CUE=$(find . -type f -name 'butterscotch_ps1.cue' | head -n1)
          test -n "$CUE"
          BIN=$(grep -o 'FILE "[^"]*"' "$CUE" | sed 's/^FILE "//;s/"$//' | head -n1)
          if [ -z "$BIN" ]; then BIN=$(find . -type f -name '*.bin' | head -n1); else BIN="$(dirname "$CUE")/$BIN"; fi
          test -f "$BIN"
          cp "$BIN" out/butterscotch_ps1.bin
          cp "$CUE" out/butterscotch_ps1.cue

      - name: Upload PS1 CD
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps1-chapter1-core
          if-no-files-found: error
          path: out/
