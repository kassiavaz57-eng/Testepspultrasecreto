name: Butterscotch PS1 CD

on:
  workflow_dispatch:
  push:
    branches: [ps1-experiment]
    paths: ["ps1/**", "data.win", ".github/workflows/ps1-cd.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: luksamuk/psxtoolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Butterscotch source
        run: git clone --depth 1 https://github.com/ButterscotchRunner/Butterscotch.git upstream

      - name: Connect Butterscotch core to PS1 backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The upstream tree is intentionally patched at build time so the
          # project continues to track the real Butterscotch core without
          # forking its DataWin/VM/Runner implementation.
          p = Path("upstream/src/platformdefs.h")
          s = p.read_text()
          old = """enum GraphicsAPI {\n    SOFTWARE,\n    MODERN_GL,\n    LEGACY_GL,\n    NOOP\n};"""
          new = """enum GraphicsAPI {\n    SOFTWARE,\n    MODERN_GL,\n    LEGACY_GL,\n    NOOP,\n    PS1\n};"""
          if old not in s:
              raise SystemExit("platformdefs.h: GraphicsAPI enum shape changed upstream")
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path("upstream/src/loop.c")
          s = p.read_text()

          s = s.replace("#ifndef __wasi__\n#include <signal.h>",
                        "#if !defined(__wasi__) && !defined(PLATFORM_PS1)\n#include <signal.h>", 1)
          s = s.replace('#include "stb_image_write.h"\n',
                        '#ifndef PLATFORM_PS1\n#include "stb_image_write.h"\n#endif\n', 1)
          s = s.replace("#ifndef _WIN32\n#include <fcntl.h>\n#include <unistd.h>",
                        "#ifndef _WIN32\n#if !defined(PLATFORM_PS1)\n#include <fcntl.h>\n#include <unistd.h>\n#endif", 1)

          old = '#include "overlay_file_system.h"\n'
          new = '#ifndef PLATFORM_PS1\n#include "overlay_file_system.h"\n#endif\n'
          if old not in s:
              raise SystemExit("loop.c: overlay filesystem include not found")
          s = s.replace(old, new, 1)

          old = 'const char* savePath = args.saveFolder != nullptr ? args.saveFolder : dataWinDir;\n        OverlayFileSystem* overlayFs = OverlayFileSystem_create(dataWinDir, savePath);'
          new = '''const char* savePath = args.saveFolder != nullptr ? args.saveFolder : dataWinDir;
#ifdef PLATFORM_PS1
        FileSystem* overlayFs = Ps1FileSystem_create(nullptr, dataWin->gen8.displayName);
#else
        OverlayFileSystem* overlayFs = OverlayFileSystem_create(dataWinDir, savePath);
#endif'''
          if old not in s:
              raise SystemExit("loop.c: filesystem creation block changed upstream")
          s = s.replace(old, new, 1)

          old = '        OverlayFileSystem_destroy(overlayFs);'
          new = '''#ifdef PLATFORM_PS1
        Ps1FileSystem_destroy(overlayFs);
#else
        OverlayFileSystem_destroy(overlayFs);
#endif'''
          if old not in s:
              raise SystemExit("loop.c: filesystem destroy block changed upstream")
          s = s.replace(old, new, 1)

          old = '#include "debug_font/debug_font.h"\n'
          new = '#include "debug_font/debug_font.h"\n#ifdef PLATFORM_PS1\n#include "../../ps1/ps1_renderer.h"\n#include "../../ps1/ps1_file_system.h"\n#endif\n'
          if old not in s:
              raise SystemExit("loop.c: debug font include anchor changed upstream")
          s = s.replace(old, new, 1)

          old = '        Renderer* renderer = nullptr;\n#ifdef ENABLE_SW_RENDERER'
          new = '''        Renderer* renderer = nullptr;
#ifdef PLATFORM_PS1
        if (gfx == PS1)
            renderer = Ps1Renderer_create();
#endif
#ifdef ENABLE_SW_RENDERER'''
          if old not in s:
              raise SystemExit("loop.c: renderer creation anchor changed upstream")
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Build real Butterscotch core
        run: |
          export PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b
          export PATH=/opt/psn00bsdk/bin:$PATH
          cmake -S ps1 -B ps1/build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=$PSN00BSDK_LIBS/cmake/sdk.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ps1/build -j2

      - name: Prepare Chapter 1 CD
        run: |
          mkdir -p ps1/cd out
          cp ps1/build/butterscotch_ps1.exe ps1/cd/BUTTER.EXE
          cp data.win ps1/cd/DATA.WIN
          printf 'BOOT=cdrom:\\BUTTER.EXE;1\nTCB=4\nEVENT=10\nSTACK=801FFFF0\n' > ps1/cd/SYSTEM.CNF
          cat > ps1/cd.xml <<'XML'
          <?xml version="1.0"?>
          <iso_project image_name="butterscotch_ps1" cue_sheet="butterscotch_ps1.cue">
            <track type="data">
              <identifiers system="PLAYSTATION" application="PLAYSTATION" volume="BUTTERSCOTCH" publisher="BUTTERSCOTCH"/>
              <directory_tree>
                <file name="SYSTEM.CNF" type="data" source="cd/SYSTEM.CNF"/>
                <file name="BUTTER.EXE" type="data" source="cd/BUTTER.EXE"/>
                <file name="DATA.WIN" type="data" source="cd/DATA.WIN"/>
              </directory_tree>
            </track>
          </iso_project>
          XML
          mkpsxiso ps1/cd.xml
          CUE=$(find . -type f -name 'butterscotch_ps1.cue' | head -n1)
          test -n "$CUE"
          BIN=$(grep -o 'FILE "[^"]*"' "$CUE" | sed 's/^FILE "//;s/"$//' | head -n1)
          if [ -z "$BIN" ]; then BIN=$(find . -type f -name '*.bin' | head -n1); else BIN="$(dirname "$CUE")/$BIN"; fi
          test -f "$BIN"
          cp "$BIN" out/butterscotch_ps1.bin
          cp "$CUE" out/butterscotch_ps1.cue

      - name: Upload PS1 CD
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps1-chapter1-core
          if-no-files-found: error
          path: out/
