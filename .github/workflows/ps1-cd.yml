name: Butterscotch PS1 CD

on:
  workflow_dispatch:
  push:
    branches: [ps1-experiment]
    paths: ["ps1/**", "data.win", ".github/workflows/ps1-cd.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: luksamuk/psxtoolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Butterscotch source
        run: git clone --depth 1 https://github.com/ButterscotchRunner/Butterscotch.git upstream

      - name: Mark Butterscotch PS1 platform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("upstream/src/loop.c")
          s=p.read_text()
          s=s.replace("#ifndef __wasi__\n#include <signal.h>", "#if !defined(__wasi__) && !defined(PLATFORM_PS1)\n#include <signal.h>")
          s=s.replace('#include "stb_image_write.h"\n', '#ifndef PLATFORM_PS1\n#include "stb_image_write.h"\n#endif\n')
          s=s.replace("#ifndef _WIN32\n#include <fcntl.h>\n#include <unistd.h>", "#ifndef _WIN32\n#if !defined(PLATFORM_PS1)\n#include <fcntl.h>\n#include <unistd.h>\n#endif")
          s=s.replace('#include "overlay_file_system.h"\n', '#ifdef USE_OVERLAY_FILE_SYSTEM\n#include "overlay_file_system.h"\n#endif\n')
          s=s.replace('OverlayFileSystem* overlayFs = OverlayFileSystem_create(dataWinDir, savePath);', '#ifdef USE_OVERLAY_FILE_SYSTEM\n        FileSystem* overlayFs = (FileSystem*)OverlayFileSystem_create(dataWinDir, savePath);\n#else\n        FileSystem* overlayFs = NoopFileSystem_create();\n#endif')
          s=s.replace('        OverlayFileSystem_destroy(overlayFs);', '#ifdef USE_OVERLAY_FILE_SYSTEM\n        OverlayFileSystem_destroy((OverlayFileSystem*) overlayFs);\n#else\n        NoopFileSystem_destroy(overlayFs);\n#endif')
          s=s.replace('#include "debug_font/debug_font.h"\n', '#include "debug_font/debug_font.h"\n#include "noop_file_system.h"\n')
          p.write_text(s)

          p=Path("upstream/src/noop_file_system.c")
          s=p.read_text()
          s=s.replace('#include "utils.h"', '#include "utils.h"\\n#include "stdio_compat.h"')
          s=s.replace('    bool dirty;\\n} NoopBinaryHandle;', '    bool dirty;\\n#ifdef PLATFORM_PS1\\n    FILE* cdFile;\\n    bool cdBacked;\\n#endif\\n} NoopBinaryHandle;')
          old='''    if (mode == GML_FILE_BIN_WRITE) {
        // Truncate: empty buffer, dirty so close() always writes (even if no bytes added)
        h->dirty = true;
    } else {
        ptrdiff_t idx = shgeti(nfs->binaryFiles, relativePath);'''
          new='''    if (mode == GML_FILE_BIN_WRITE) {
        h->dirty = true;
    } else {
        ptrdiff_t idx = shgeti(nfs->binaryFiles, relativePath);'''
          s=s.replace(old,new)
          needle='''        } else if (mode == GML_FILE_BIN_READ) {
            // Pure read of a missing file: fail
            free(h->path);
            free(h);
            return nullptr;
        }
    }
    return h;'''
          repl='''        } else if (mode == GML_FILE_BIN_READ) {
#ifdef PLATFORM_PS1
            FILE* fp = fopen(relativePath, "rb");
            if (fp != nullptr) {
                fseek(fp, 0, SEEK_END);
                long sz = ftell(fp);
                fseek(fp, 0, SEEK_SET);
                h->cdFile = fp;
                h->cdBacked = true;
                h->size = (int32_t)sz;
                h->capacity = 0;
                h->position = 0;
                return h;
            }
#endif
            free(h->path);
            free(h);
            return nullptr;
        }
    }
    return h;'''
          if needle not in s: raise SystemExit("open needle missing")
          s=s.replace(needle,repl)
          s=s.replace('''    if (h->dirty) {''','''#ifdef PLATFORM_PS1
    if (h->cdBacked) {
        if (h->cdFile) fclose(h->cdFile);
        free(h->path);
        free(h);
        return;
    }
#endif
    if (h->dirty) {''',1)
          s=s.replace('''    if (handle == nullptr || 0 >= n) return 0;
    NoopBinaryHandle* h = (NoopBinaryHandle*) handle;
    int32_t avail = h->size - h->position;''','''    if (handle == nullptr || 0 >= n) return 0;
    NoopBinaryHandle* h = (NoopBinaryHandle*) handle;
#ifdef PLATFORM_PS1
    if (h->cdBacked) return (int32_t)fread(dst, 1, (size_t)n, h->cdFile);
#endif
    int32_t avail = h->size - h->position;''',1)
          s=s.replace('''static int32_t noopBinaryTell(MAYBE_UNUSED FileSystem* fs, void* handle) {
    return handle != nullptr ? ((NoopBinaryHandle*) handle)->position : 0;
}''','''static int32_t noopBinaryTell(MAYBE_UNUSED FileSystem* fs, void* handle) {
    if (handle == nullptr) return 0;
#ifdef PLATFORM_PS1
    NoopBinaryHandle* h = (NoopBinaryHandle*)handle;
    if (h->cdBacked) return (int32_t)ftell(h->cdFile);
#endif
    return ((NoopBinaryHandle*) handle)->position;
}''')
          s=s.replace('''    if (handle == nullptr) return false;
    if (0 > pos) pos = 0;
    ((NoopBinaryHandle*) handle)->position = pos;
    return true;''','''    if (handle == nullptr) return false;
    if (0 > pos) pos = 0;
#ifdef PLATFORM_PS1
    NoopBinaryHandle* h = (NoopBinaryHandle*)handle;
    if (h->cdBacked) return fseek(h->cdFile, pos, SEEK_SET) == 0;
#endif
    ((NoopBinaryHandle*) handle)->position = pos;
    return true;''')
          s=s.replace('''static int32_t noopBinarySize(MAYBE_UNUSED FileSystem* fs, void* handle) {
    return handle != nullptr ? ((NoopBinaryHandle*) handle)->size : 0;
}''','''static int32_t noopBinarySize(MAYBE_UNUSED FileSystem* fs, void* handle) {
    if (handle == nullptr) return 0;
    return ((NoopBinaryHandle*) handle)->size;
}''')
          p.write_text(s)
          p=Path("upstream/src/noop_renderer.c")
          s=p.read_text()
          s=s.replace('#include "noop_renderer.h"', '#include "noop_renderer.h"\n#ifdef PLATFORM_PS1\n#include <psxetc.h>\n#include <psxgpu.h>\n#endif')

          s=s.replace('typedef struct {\n    Renderer base;', '''#ifdef PLATFORM_PS1
          #define PS1_OT_LEN 8
          #define PS1_PRIM_BYTES 32768
          static DISPENV ps1Disp[2];
          static DRAWENV ps1Draw[2];
          static uint32_t ps1Ot[2][PS1_OT_LEN];
          static uint8_t ps1Prim[2][PS1_PRIM_BYTES];
          static uint8_t *ps1Next;
          static int ps1Db;
          #endif

          typedef struct {
              Renderer base;''')

          s=s.replace('static void noopInit(Renderer *renderer, DataWin *dataWin) {\n    renderer->dataWin = dataWin;', '''static void noopInit(Renderer *renderer, DataWin *dataWin) {
              renderer->dataWin = dataWin;
          #ifdef PLATFORM_PS1
              ResetGraph(0);
              SetDefDispEnv(&ps1Disp[0], 0, 0, 320, 240);
              SetDefDispEnv(&ps1Disp[1], 0, 240, 320, 240);
              SetDefDrawEnv(&ps1Draw[0], 0, 240, 320, 240);
              SetDefDrawEnv(&ps1Draw[1], 0, 0, 320, 240);
              ps1Draw[0].isbg = 1;
              ps1Draw[1].isbg = 1;
              setRGB0(&ps1Draw[0], 12, 12, 20);
              setRGB0(&ps1Draw[1], 12, 12, 20);
              ps1Db = 0;
              PutDispEnv(&ps1Disp[0]);
              PutDrawEnv(&ps1Draw[0]);
              SetDispMask(1);
          #endif''')

          s=s.replace('static void noopBeginFrame(MAYBE_UNUSED Renderer *renderer, MAYBE_UNUSED int32_t gameW, MAYBE_UNUSED int32_t gameH, MAYBE_UNUSED int32_t windowW, MAYBE_UNUSED int32_t windowH) {}', '''static void noopBeginFrame(MAYBE_UNUSED Renderer *renderer, MAYBE_UNUSED int32_t gameW, MAYBE_UNUSED int32_t gameH, MAYBE_UNUSED int32_t windowW, MAYBE_UNUSED int32_t windowH) {
          #ifdef PLATFORM_PS1
              ClearOTagR(ps1Ot[ps1Db], PS1_OT_LEN);
              ps1Next = ps1Prim[ps1Db];
          #endif
          }''')

          s=s.replace('static void noopEndFrameEnd(MAYBE_UNUSED Renderer *renderer) {}', '''static void noopEndFrameEnd(MAYBE_UNUSED Renderer *renderer) {
          #ifdef PLATFORM_PS1
              DrawOTag(ps1Ot[ps1Db] + PS1_OT_LEN - 1);
              DrawSync(0);
              VSync(0);
              ps1Db ^= 1;
              PutDispEnv(&ps1Disp[ps1Db]);
              PutDrawEnv(&ps1Draw[ps1Db]);
              SetDispMask(1);
              /* Temporary visible GPU proof: remove after real textures work. */
              ClearOTagR(ps1Ot[ps1Db], PS1_OT_LEN);
              ps1Next = ps1Prim[ps1Db];
              TILE *proof = (TILE *)ps1Next;
              setTile(proof);
              setXY0(proof, 96, 72);
              setWH(proof, 128, 96);
              setRGB0(proof, 64, 192, 255);
              addPrim(ps1Ot[ps1Db] + PS1_OT_LEN - 1, proof);
              ps1Next += sizeof(TILE);
              DrawOTag(ps1Ot[ps1Db] + PS1_OT_LEN - 1);
              DrawSync(0);
              VSync(0);
          #endif
          }''')

          old='static void noopDrawRectangle(MAYBE_UNUSED Renderer *renderer, MAYBE_UNUSED float x1, MAYBE_UNUSED float y1, MAYBE_UNUSED float x2, MAYBE_UNUSED float y2, MAYBE_UNUSED uint32_t color, MAYBE_UNUSED float alpha, MAYBE_UNUSED bool outline) {}'
          new='''static void noopDrawRectangle(Renderer *renderer, float x1, float y1, float x2, float y2, uint32_t color, float alpha, bool outline) {
          #ifdef PLATFORM_PS1
              (void)renderer; (void)alpha;
              if (outline) return;
              if (ps1Next + sizeof(TILE) > ps1Prim[ps1Db] + PS1_PRIM_BYTES) return;
              TILE *tile = (TILE *)ps1Next;
              setTile(tile);
              setXY0(tile, (int)x1, (int)y1);
              setWH(tile, (int)(x2-x1), (int)(y2-y1));
              setRGB0(tile, (color >> 16) & 255, (color >> 8) & 255, color & 255);
              addPrim(ps1Ot[ps1Db] + PS1_OT_LEN - 1, tile);
              ps1Next += sizeof(TILE);
          #else
              (void)renderer; (void)x1; (void)y1; (void)x2; (void)y2; (void)color; (void)alpha; (void)outline;
          #endif
          }'''
          s=s.replace(old,new)

          old='static void noopDrawSprite(MAYBE_UNUSED Renderer *renderer, MAYBE_UNUSED int32_t tpagIndex, MAYBE_UNUSED float x, MAYBE_UNUSED float y, MAYBE_UNUSED float originX, MAYBE_UNUSED float originY, MAYBE_UNUSED float xscale, MAYBE_UNUSED float yscale, MAYBE_UNUSED float angleDeg, MAYBE_UNUSED uint32_t color, MAYBE_UNUSED float alpha) {}'
          new='''static void noopDrawSprite(Renderer *renderer, int32_t tpagIndex, float x, float y, float originX, float originY, float xscale, float yscale, float angleDeg, uint32_t color, float alpha) {
          #ifdef PLATFORM_PS1
              (void)angleDeg; (void)alpha;
              if (!renderer || !renderer->dataWin || tpagIndex < 0 || (uint32_t)tpagIndex >= renderer->dataWin->tpag.count) return;
              TexturePageItem *t = &renderer->dataWin->tpag.items[tpagIndex];
              int w = (int)(t->boundingWidth * (xscale < 0 ? -xscale : xscale));
              int h = (int)(t->boundingHeight * (yscale < 0 ? -yscale : yscale));
              if (w <= 0 || h <= 0) return;
              if (ps1Next + sizeof(TILE) > ps1Prim[ps1Db] + PS1_PRIM_BYTES) return;
              TILE *tile = (TILE *)ps1Next;
              setTile(tile);
              setXY0(tile, (int)(x-originX*xscale), (int)(y-originY*yscale));
              setWH(tile, w, h);
              setRGB0(tile, (color >> 16) & 255, (color >> 8) & 255, color & 255);
              addPrim(ps1Ot[ps1Db] + PS1_OT_LEN - 1, tile);
              ps1Next += sizeof(TILE);
          #else
              (void)renderer; (void)tpagIndex; (void)x; (void)y; (void)originX; (void)originY; (void)xscale; (void)yscale; (void)angleDeg; (void)color; (void)alpha;
          #endif
          }'''
          s=s.replace(old,new)

          s=s.replace('static void noopClearScreen(MAYBE_UNUSED Renderer *renderer, MAYBE_UNUSED uint32_t color, MAYBE_UNUSED float alpha) {}', '''static void noopClearScreen(MAYBE_UNUSED Renderer *renderer, MAYBE_UNUSED uint32_t color, MAYBE_UNUSED float alpha) {
          #ifdef PLATFORM_PS1
              RECT r;
              r.x = 0; r.y = 0; r.w = 320; r.h = 240;
              (void)renderer; (void)color; (void)alpha;
          #endif
          }''')
          p.write_text(s)
          PY

      - name: Build real Butterscotch core
        run: |
          export PSN00BSDK_LIBS=/opt/psn00bsdk/lib/libpsn00b
          export PATH=/opt/psn00bsdk/bin:$PATH
          cmake -S ps1 -B ps1/build -G "Unix Makefiles"             -DCMAKE_TOOLCHAIN_FILE=$PSN00BSDK_LIBS/cmake/sdk.cmake             -DCMAKE_BUILD_TYPE=Release
          cmake --build ps1/build -j2

      - name: Prepare Chapter 1 CD
        run: |
          mkdir -p ps1/cd out
          cp ps1/build/butterscotch_ps1.exe ps1/cd/BUTTER.EXE
          cp data.win ps1/cd/DATA.WIN
          printf 'BOOT=cdrom:\\BUTTER.EXE;1\nTCB=4\nEVENT=10\nSTACK=801FFFF0\n' > ps1/cd/SYSTEM.CNF
          cat > ps1/cd.xml <<'XML'
          <?xml version="1.0"?>
          <iso_project image_name="butterscotch_ps1" cue_sheet="butterscotch_ps1.cue">
            <track type="data">
              <identifiers system="PLAYSTATION" application="PLAYSTATION" volume="BUTTERSCOTCH" publisher="BUTTERSCOTCH"/>
              <directory_tree>
                <file name="SYSTEM.CNF" type="data" source="cd/SYSTEM.CNF"/>
                <file name="BUTTER.EXE" type="data" source="cd/BUTTER.EXE"/>
                <file name="DATA.WIN" type="data" source="cd/DATA.WIN"/>
              </directory_tree>
            </track>
          </iso_project>
          XML
          mkpsxiso ps1/cd.xml
          CUE=$(find . -type f -name 'butterscotch_ps1.cue' | head -n1)
          test -n "$CUE"
          BIN=$(grep -o 'FILE "[^"]*"' "$CUE" | sed 's/^FILE "//;s/"$//' | head -n1)
          if [ -z "$BIN" ]; then BIN=$(find . -type f -name '*.bin' | head -n1); else BIN="$(dirname "$CUE")/$BIN"; fi
          test -f "$BIN"
          cp "$BIN" out/butterscotch_ps1.bin
          cp "$CUE" out/butterscotch_ps1.cue

      - name: Upload PS1 CD
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps1-chapter1-core
          if-no-files-found: error
          path: out/
