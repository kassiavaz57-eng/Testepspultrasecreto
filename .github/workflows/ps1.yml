name: Butterscotch PS1

on:
  push:
    branches: [ps1-experiment]
  workflow_dispatch:

jobs:
  build-ps1:
    runs-on: ubuntu-latest
    container:
      image: luksamuk/psxtoolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Butterscotch upstream
        run: |
          git clone --depth 1 https://github.com/ButterscotchRunner/Butterscotch.git upstream

      - name: Fix PS1 renderer source syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ps1/ps1_renderer.c')
          s = p.read_text()
          s = re.sub(r'static void ps1EndView\(Renderer\*r\)\{\(void\)r\}', 'static void ps1EndView(Renderer*r){(void)r;}', s)
          s = s.replace('.drawSetBlendMode=ps1DrawSetBlendMode', '.gpuSetBlendMode=ps1DrawSetBlendMode')
          s = re.sub(r',?\.drawSetAlphaTest=ps1DrawSetAlphaTest', '', s)
          s = re.sub(r',?\.drawSetColorWriteMask=ps1DrawSetColorWriteMask', '', s)
          s = re.sub(r',?\.drawSetBlendEnable=ps1DrawSetBlendEnable', '', s)
          s = re.sub(r',?\.drawSetBlendFactors=ps1DrawSetBlendFactors', '', s)
          s = re.sub(r',?\.present=ps1Present', '', s)
          p.write_text(s)

          p = Path('ps1/ps1_fast_renderer.c')
          s = p.read_text().replace('RendererVTable', 'RendererVtable')
          p.write_text(s)
          PY

      - name: Build PS1 executable
        run: |
          export PSN00BSDK_LIBS="${PSN00BSDK_LIBS:-/opt/psn00bsdk/lib/libpsn00b}"
          export PATH="/opt/psn00bsdk/bin:$PATH"
          cmake -S ps1 -B ps1/build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ps1/build -j2

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps1-bootstrap
          path: |
            ps1/build/butterscotch_ps1.exe
            ps1/build/*.elf
