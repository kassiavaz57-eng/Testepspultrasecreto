name: Butterscotch PS1

on:
  push:
    branches: [ps1-experiment]
  workflow_dispatch:

jobs:
  preprocess-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21 for the real Butterscotch preprocessor
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch Butterscotch preprocessor
        run: |
          git clone --depth 1 https://github.com/ButterscotchRunner/ButterscotchPreprocessor.git preprocessor

      - name: Generate real Butterscotch PS2-format asset bundle
        run: |
          mkdir -p ps1/generated
          test -f "$GITHUB_WORKSPACE/data.win"
          cd preprocessor
          ./gradlew --no-daemon :processor-cli:run --args="$GITHUB_WORKSPACE/data.win -o $GITHUB_WORKSPACE/ps1/generated --target ps2"

      - name: Upload generated runtime assets
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps1-assets
          path: ps1/generated/

  build-ps1:
    needs: preprocess-assets
    runs-on: ubuntu-latest
    container:
      image: luksamuk/psxtoolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated runtime assets
        uses: actions/download-artifact@v4
        with:
          name: butterscotch-ps1-assets
          path: ps1/generated

      - name: Fetch Butterscotch upstream
        run: |
          git clone --depth 1 https://github.com/ButterscotchRunner/Butterscotch.git upstream

      - name: Normalize PS1 renderer to the real Butterscotch API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ps1/ps1_renderer.c')
          s = p.read_text()
          s = re.sub(r'static void ps1EndView\(Renderer\*r\)\{\(void\)r\}', 'static void ps1EndView(Renderer*r){(void)r;}', s)
          s = s.replace('RendererVTable', 'RendererVtable')

          # The PS1 backend predates the current Butterscotch vtable names.
          # Keep the real renderer functions, but expose them through the
          # current API instead of relying on invalid initializer designators.
          marker = 'static void ps1DrawSetBlendFactors(Renderer*r,BlendFactors f){((Ps1Renderer*)r)->blendFactors=f;}'
          wrappers = r'''
          static BlendFactors ps1GpuGetBlendFactors(Renderer*r){return ((Ps1Renderer*)r)->blendFactors;}
          static int32_t ps1GpuGetBlendMode(Renderer*r){return ((Ps1Renderer*)r)->blendMode;}
          static void ps1GpuSetBlendModeExt(Renderer*r,int32_t s,int32_t d,int32_t sa,int32_t da){BlendFactors f={s,d,sa,da};((Ps1Renderer*)r)->blendFactors=f;}
          static void ps1GpuSetAlphaTestEnable(Renderer*r,bool e){((Ps1Renderer*)r)->alphaTestEnable=e;}
          static bool ps1GpuGetAlphaTestEnable(Renderer*r){return ((Ps1Renderer*)r)->alphaTestEnable;}
          static void ps1GpuSetAlphaTestRef(Renderer*r,uint8_t ref){((Ps1Renderer*)r)->alphaTestRef=ref;}
          static void ps1GpuGetColorWriteEnable(Renderer*r,bool*rr,bool*g,bool*b,bool*a){Ps1Renderer*p=(Ps1Renderer*)r;if(rr)*rr=p->colorWriteR;if(g)*g=p->colorWriteG;if(b)*b=p->colorWriteB;if(a)*a=p->colorWriteA;}
          static bool ps1GpuGetBlendEnable(Renderer*r){return ((Ps1Renderer*)r)->blendEnable;}
          static void ps1GpuSetFog(Renderer*r,bool e,uint32_t c){(void)r;(void)e;(void)c;}
          '''
          if marker in s and 'ps1GpuGetBlendFactors' not in s:
              s = s.replace(marker, marker + wrappers)

          # Submit the OT to the buffer we just rendered, then display that
          # buffer while switching the draw target to the other framebuffer.
          old_present = 'static void ps1Present(Renderer*r){Ps1Renderer*p=(Ps1Renderer*)r;DrawSync(0);VSync(0);PutDispEnv(&p->buffers[p->active].disp);PutDrawEnv(&p->buffers[p->active].draw);DrawOTagEnv(p->buffers[p->active].ot,&p->buffers[p->active].draw);p->active^=1;}'
          new_present = 'static void ps1Present(Renderer*r){Ps1Renderer*p=(Ps1Renderer*)r;DrawOTagEnv(p->buffers[p->active].ot,&p->buffers[p->active].draw);DrawSync(0);VSync(0);p->active^=1;PutDispEnv(&p->buffers[p->active].disp);PutDrawEnv(&p->buffers[p->active].draw);}'
          s = s.replace(old_present, new_present)

          start = s.find('Renderer* Ps1Renderer_create(void)')
          if start < 0:
              raise SystemExit('Ps1Renderer_create not found')
          prefix = s[:start]
          tail = r'''static RendererVtable gPs1Vtable = {
              .init=ps1Init,
              .destroy=ps1Destroy,
              .beginFrame=ps1BeginFrame,
              .endFrameInit=ps1EndFrameInit,
              .endFrameEnd=ps1EndFrameEnd,
              .beginView=ps1BeginView,
              .endView=ps1EndView,
              .applyProjection=ps1ApplyProjection,
              .beginGUI=ps1BeginGUI,
              .setGuiProjection=ps1SetGuiProjection,
              .endGUI=ps1EndGUI,
              .drawSprite=ps1DrawSprite,
              .drawSpritePart=ps1DrawSpritePart,
              .drawSpritePartColor=ps1DrawSpritePartColor,
              .drawSpritePos=ps1DrawSpritePos,
              .drawRectangle=ps1DrawRectangle,
              .drawRectangleColor=ps1DrawRectangleColor,
              .drawLine=ps1DrawLine,
              .drawTriangle=ps1DrawTriangle,
              .drawLineColor=ps1DrawLineColor,
              .drawText=ps1DrawText,
              .drawTextColor=ps1DrawTextColor,
              .drawTextUI=ps1DrawTextColor,
              .gpuGetBlendFactors=ps1GpuGetBlendFactors,
              .gpuGetBlendMode=ps1GpuGetBlendMode,
              .gpuSetBlendMode=ps1DrawSetBlendMode,
              .gpuSetBlendModeExt=ps1GpuSetBlendModeExt,
              .gpuSetBlendEnable=ps1DrawSetBlendEnable,
              .gpuSetAlphaTestEnable=ps1GpuSetAlphaTestEnable,
              .gpuGetAlphaTestEnable=ps1GpuGetAlphaTestEnable,
              .gpuSetAlphaTestRef=ps1GpuSetAlphaTestRef,
              .gpuSetColorWriteEnable=ps1DrawSetColorWriteMask,
              .gpuGetColorWriteEnable=ps1GpuGetColorWriteEnable,
              .gpuGetBlendEnable=ps1GpuGetBlendEnable,
              .gpuSetFog=ps1GpuSetFog,
              .drawTile=ps1DrawTile,
              .drawSpriteTiled=ps1DrawSpriteTiled,
              .drawTiledPart=ps1DrawTiledPart
          };
          Renderer* Ps1Renderer_create(void){Ps1Renderer*p=(Ps1Renderer*)calloc(1,sizeof(*p));if(!p)return NULL;p->active=0;p->base.vtable=&gPs1Vtable;gPs1Renderer=p;return &p->base;}
          void Ps1Renderer_present(void){if(gPs1Renderer)ps1Present(&gPs1Renderer->base);}
          '''
          s = prefix + tail
          p.write_text(s)

          p = Path('ps1/ps1_fast_renderer.c')
          s = p.read_text().replace('RendererVTable', 'RendererVtable')
          p.write_text(s)

          # PS1 has only 2 MiB of RAM. Avoid the large temporary chunk
          # allocation used by the desktop/PS2 fast path. Keep the real
          # DataWin parser and BinaryReader, but let PS1 parse directly from
          # the DATA.WIN FILE stream.
          p = Path('upstream/src/data_win.c')
          s = p.read_text()

          # Expose fine-grained GEN8 stages on the PS1 debug screen. This is
          # temporary instrumentation only; it does not replace the parser.
          marker = '#include "data_win.h"\n'
          hook = '''#include "data_win.h"\n#ifdef PLATFORM_PS1\nextern void ps1DataWinDebugStage(const char* stage);\n#define PS1_DATAWIN_STAGE(stage) ps1DataWinDebugStage(stage)\n#else\n#define PS1_DATAWIN_STAGE(stage) ((void)0)\n#endif\n'''
          if marker in s and 'PS1_DATAWIN_STAGE' not in s:
              s = s.replace(marker, hook, 1)
          stages = [
              ('    g->wadVersion = BinaryReader_readUint8(reader);\n', '    g->wadVersion = BinaryReader_readUint8(reader);\n    PS1_DATAWIN_STAGE("version");\n'),
              ('    g->lastObj = BinaryReader_readUint32(reader);\n', '    g->lastObj = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("strings");\n'),
              ('    g->name = readStringPtr(reader, dw);\n', '    g->name = readStringPtr(reader, dw);\n    PS1_DATAWIN_STAGE("name");\n'),
              ('    g->major = BinaryReader_readUint32(reader);\n', '    g->major = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("major");\n'),
              ('    g->minor = BinaryReader_readUint32(reader);\n', '    g->minor = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("minor");\n'),
              ('    g->release = BinaryReader_readUint32(reader);\n', '    g->release = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("release");\n'),
              ('    g->build = BinaryReader_readUint32(reader);\n', '    g->build = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("build");\n'),
              ('    g->defaultWindowWidth = BinaryReader_readUint32(reader);\n', '    g->defaultWindowWidth = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("width");\n'),
              ('    g->defaultWindowHeight = BinaryReader_readUint32(reader);\n', '    g->defaultWindowHeight = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("height");\n'),
              ('    g->timestamp = BinaryReader_readUint64(reader);\n', '    g->timestamp = BinaryReader_readUint64(reader);\n    PS1_DATAWIN_STAGE("timestamp");\n'),
              ('    g->displayName = readStringPtr(reader, dw);\n', '    PS1_DATAWIN_STAGE("display-begin");\n    g->displayName = readStringPtr(reader, dw);\n    PS1_DATAWIN_STAGE("display");\n'),
              ('    g->roomOrderCount = BinaryReader_readUint32(reader);\n', '    g->roomOrderCount = BinaryReader_readUint32(reader);\n    PS1_DATAWIN_STAGE("room-count");\n'),
              ('    // Seed the detected version from GEN8.\n', '    PS1_DATAWIN_STAGE("done");\n\n    // Seed the detected version from GEN8.\n')
          ]
          for old, new in stages:
              if old in s:
                  s = s.replace(old, new, 1)
          pattern = r'''(?ms)^        if \(shouldParse && chunkLength > 0 && options\.loadType == DATAWINLOADTYPE_LOAD_PER_CHUNK\) \{.*?^        \}\n'''
          replacement = ("#ifdef PLATFORM_PS1\n"
                          "        if (shouldParse && chunkLength > 0 && options.loadType == DATAWINLOADTYPE_LOAD_PER_CHUNK && memcmp(chunkName, \"GEN8\", 4) == 0) {\n"
                          "#else\n"
                          "        if (shouldParse && chunkLength > 0 && options.loadType == DATAWINLOADTYPE_LOAD_PER_CHUNK) {\n"
                          "#endif\n"
                          "            chunkBuffer = (uint8_t *)malloc(chunkLength);\n"
                          "            if (chunkBuffer) {\n"
                          "                size_t read = fread(chunkBuffer, 1, chunkLength, reader.file);\n"
                          "                if (read != chunkLength) {\n"
                          "                    logError(\"DataWin: short read on chunk %.4s (expected %u, got %zu)\\\\n\", chunkName, chunkLength, read);\n"
                          "                    exit(1);\n"
                          "                }\n"
                          "                BinaryReader_setBuffer(&reader, chunkBuffer, chunkDataStart, chunkLength);\n"
                          "            }\n"
                          "        }\n")
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('could not locate DataWin per-chunk buffer block')
          p.write_text(s2)
          PY

      - name: Build real PS1 executable and CD image
        run: |
          export PSN00BSDK_LIBS="${PSN00BSDK_LIBS:-/opt/psn00bsdk/lib/libpsn00b}"
          export PATH="/opt/psn00bsdk/bin:$PATH"
          cmake -S ps1 -B ps1/build -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$PSN00BSDK_LIBS/cmake/sdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build ps1/build -j2

      - name: Package real Deltarune PS1 disc image
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-deltarune-ps1-disc
          path: |
            ps1/build/butterscotch-ps1.bin
            ps1/build/butterscotch-ps1.cue
