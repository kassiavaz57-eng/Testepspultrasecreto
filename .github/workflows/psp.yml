name: Butterscotch PSP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspsdk:latest

    steps:
      - name: Checkout PSP overlay
        uses: actions/checkout@v4

      - name: Install overlay tooling
        run: |
          apk add --no-cache python3
          python3 --version
          psp-cmake --version

      - name: Fetch upstream Butterscotch
        run: git clone --depth 1 https://github.com/ButterscotchRunner/Butterscotch.git upstream

      - name: Apply PSP overlay
        run: |
          python3 psp/apply_overlay.py upstream
          python3 psp/validate_overlay.py upstream

      - name: Configure PSP build
        working-directory: upstream
        run: |
          psp-cmake -S . -B build             -DPLATFORM=psp             -DBACKEND=noop             -DCMAKE_BUILD_TYPE=Release             -DENABLE_WAD14=OFF             -DENABLE_WAD16=ON             -DENABLE_WAD17=OFF             -DENABLE_LEGACY_GL=OFF             -DENABLE_MODERN_GL=OFF             -DENABLE_NOOP_RENDERER=ON             -DAUDIO_BACKEND=none

      - name: Build
        working-directory: upstream
        run: cmake --build build

      - name: Prepare PSP executable
        working-directory: upstream/build
        run: |
          # Match the PSPSDK's official EBOOT pipeline: fix imports, then strip.
          psp-fixup-imports butterscotch
          psp-strip butterscotch -o butterscotch_strip.elf
          test -s butterscotch_strip.elf
          readelf -h butterscotch_strip.elf | grep -E 'Class|Machine'
          ls -lh butterscotch butterscotch_strip.elf

      - name: Package EBOOT.PBP
        working-directory: upstream/build
        run: |
          mksfoex -d MEMSIZE=1 -s APP_VER=0.1 "Butterscotch PSP" PARAM.SFO
          pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL butterscotch_strip.elf NULL
          test -s EBOOT.PBP
          ls -lh EBOOT.PBP

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-psp
          path: |
            upstream/build/butterscotch
            upstream/build/EBOOT.PBP
          if-no-files-found: error